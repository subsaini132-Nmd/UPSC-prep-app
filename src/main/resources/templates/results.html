<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Test Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<!-- Header -->
<header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-5xl mx-auto py-4 px-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold">📊 Your Test Results</h1>
        <a href="/" class="bg-yellow-400 text-black px-3 py-1 rounded-md font-medium hover:bg-yellow-500">
            🏠 Back to Home
        </a>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-5xl mx-auto p-6">

    <!-- Table -->
    <div class="overflow-x-auto bg-white shadow-md rounded-lg">
        <table class="min-w-full table-auto text-sm">
            <thead class="bg-indigo-600 text-white">
            <tr>
                <th class="px-4 py-2 text-left">Subject</th>
                <th class="px-4 py-2 text-left">Score</th>
                <th class="px-4 py-2 text-left">Total</th>
                <th class="px-4 py-2 text-left">Date</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" th:each="r : ${results}">
            <tr class="hover:bg-gray-50">
                <td class="px-4 py-2 font-medium text-gray-800" th:text="${r.subject.name}"></td>
                <td class="px-4 py-2 text-green-600 font-semibold" th:text="${r.score}"></td>
                <td class="px-4 py-2 text-gray-700" th:text="${r.totalQuestions}"></td>
                <td class="px-4 py-2 text-gray-500" th:text="${#temporals.format(r.testDate, 'dd-MM-yyyy HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Summary Section (Optional) -->
    <div class="mt-6 bg-white shadow rounded-lg p-4">
        <h2 class="text-lg font-semibold text-gray-800 mb-2">📌 Summary</h2>
        <p class="text-gray-600">
            You attempted <span class="font-bold" th:text="${#lists.size(results)}"></span> tests.
            Keep practicing to improve your performance!
        </p>
    </div>

</main>

</body>
</html>
