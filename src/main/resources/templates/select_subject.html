<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Subject</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<!-- Header -->
<header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-4xl mx-auto py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">📚 UPSC Prep</h1>
        <a href="/" class="bg-yellow-400 text-black px-3 py-1 rounded-md font-medium hover:bg-yellow-500">
            🏠 Back to Home
        </a>
    </div>
</header>

<!-- Main Section -->
<main class="max-w-4xl mx-auto p-6">
    <!-- Welcome -->
    <h2 class="text-2xl font-semibold text-gray-800 mb-6"
        th:text="'Welcome ' + ${student.name} + ', select a subject:'"></h2>

    <!-- Subject Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <div th:each="s : ${subjects}"
             class="bg-white shadow-md rounded-lg p-5 text-center border hover:shadow-xl transition">

            <h3 class="text-lg font-bold text-gray-700 mb-3" th:text="${s.name}"></h3>
            <a th:href="@{/tests/take/{studentId}/{subjectId}(studentId=${student.id}, subjectId=${s.id})}"
               class="inline-block bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition">
                🎯 Take Test
            </a>
        </div>
    </div>
</main>

</body>
</html>
