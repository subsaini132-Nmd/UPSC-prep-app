<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Questions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<!-- Header -->
<header class="bg-blue-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto py-4 px-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold">📚 UPSC Prep - All Questions</h1>
        <nav class="space-x-4">
            <a href="/" class="hover:text-yellow-300">🏠 Home</a>
            <a href="/questions/add" class="bg-yellow-400 text-black px-3 py-1 rounded-md font-medium hover:bg-yellow-500">➕ Add Question</a>
        </nav>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-6xl mx-auto p-6">

    <h2 class="text-xl font-semibold mb-4 text-gray-800">All Questions</h2>

    <!-- Table -->
    <div class="overflow-x-auto bg-white shadow-md rounded-lg">
        <table class="min-w-full table-auto text-sm">
            <thead class="bg-blue-600 text-white">
            <tr>
                <th class="px-4 py-2 text-left">ID</th>
                <th class="px-4 py-2 text-left">Question</th>
                <th class="px-4 py-2 text-left">Subject</th>
                <th class="px-4 py-2 text-left">Correct Option</th>
                <th class="px-4 py-2 text-left">Marks</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" th:each="q : ${questions}">
            <tr class="hover:bg-gray-50">
                <td class="px-4 py-2 font-medium text-gray-700" th:text="${q.id}"></td>
                <td class="px-4 py-2 text-gray-800" th:text="${q.text}"></td>
                <td class="px-4 py-2 text-gray-600" th:text="${q.subject.name}"></td>
                <td class="px-4 py-2 text-green-600 font-semibold" th:text="${q.correctOption}"></td>
                <td class="px-4 py-2 text-gray-700" th:text="${q.marks}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Footer Actions -->
    <div class="mt-6 flex justify-between">
        <a href="/" class="text-blue-600 hover:underline">⬅ Back to Home</a>
        <a href="/questions/add" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">➕ Add Another Question</a>
    </div>

</main>

</body>
</html>
