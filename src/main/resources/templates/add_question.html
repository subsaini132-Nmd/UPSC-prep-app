<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<!-- Header -->
<header class="bg-blue-700 text-white shadow-md">
    <div class="max-w-4xl mx-auto py-4 px-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold">📝 Add Question</h1>
        <a href="/" class="bg-yellow-400 text-black px-4 py-2 rounded-lg font-medium hover:bg-yellow-500">🏠 Home</a>
    </div>
</header>

<!-- Form Container -->
<main class="max-w-3xl mx-auto mt-10 bg-white shadow-lg rounded-2xl p-8">
    <h2 class="text-xl font-semibold mb-6 text-gray-800">Create a New Question</h2>

    <form th:action="@{/questions/add}" th:object="${question}" method="post" class="space-y-5">

        <!-- Question Text -->
        <div>
            <label class="block text-gray-700 font-medium mb-1">Question</label>
            <input type="text" th:field="*{text}" required
                   class="w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"/>
        </div>

        <!-- Options Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 font-medium mb-1">Option A</label>
                <input type="text" th:field="*{optionA}" required
                       class="w-full border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500"/>
            </div>
            <div>
                <label class="block text-gray-700 font-medium mb-1">Option B</label>
                <input type="text" th:field="*{optionB}" required
                       class="w-full border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500"/>
            </div>
            <div>
                <label class="block text-gray-700 font-medium mb-1">Option C</label>
                <input type="text" th:field="*{optionC}" required
                       class="w-full border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500"/>
            </div>
            <div>
                <label class="block text-gray-700 font-medium mb-1">Option D</label>
                <input type="text" th:field="*{optionD}" required
                       class="w-full border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500"/>
            </div>
        </div>

        <!-- Correct Option -->
        <div>
            <label class="block text-gray-700 font-medium mb-1">Correct Option (A/B/C/D)</label>
            <input type="text" th:field="*{correctOption}" required
                   class="w-full border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Marks -->
        <div>
            <label class="block text-gray-700 font-medium mb-1">Marks</label>
            <input type="number" th:field="*{marks}" value="1"
                   class="w-full border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Subject -->
        <div>
            <label class="block text-gray-700 font-medium mb-1">Subject</label>
            <select name="subjectId" required
                    class="w-full border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500">
                <option th:each="s : ${subjects}"
                        th:value="${s.id}"
                        th:text="${s.name}"></option>
            </select>
        </div>

        <!-- Submit Button -->
        <div class="text-right">
            <button type="submit"
                    class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 shadow-md">
                ✅ Save Question
            </button>
        </div>
    </form>
</main>

</body>
</html>
