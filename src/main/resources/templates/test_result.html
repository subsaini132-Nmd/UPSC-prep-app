<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<!-- Header -->
<header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-4xl mx-auto py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold" th:text="'Test Result for ' + ${student.name}">Test Result</h1>
        <a href="/" class="bg-yellow-400 text-black px-3 py-1 rounded-md font-medium hover:bg-yellow-500">
            🏠 Back to Dashboard
        </a>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-4xl mx-auto p-6">

    <div class="bg-white shadow-lg rounded-2xl p-6 border">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4" th:text="'Subject: ' + ${subject.name}">Subject Name</h2>

        <div class="text-center mt-6">
            <p class="text-lg text-gray-700 mb-2">🎯 Score:</p>
            <p class="text-4xl font-bold text-green-600" th:text="${score}">0</p>
        </div>
    </div>

    <div class="mt-6 text-center">
        <a href="/"
           class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-indigo-700 shadow-md">
            🔙 Back to Home
        </a>
    </div>

</main>

</body>
</html>
