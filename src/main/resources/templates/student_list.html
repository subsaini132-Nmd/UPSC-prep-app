<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student List</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<!-- Header -->
<header class="bg-indigo-700 text-white shadow-md">
  <div class="max-w-5xl mx-auto py-4 px-6 flex justify-between items-center">
    <h1 class="text-xl font-bold">👩‍🎓 UPSC Prep</h1>
    <a href="/" class="bg-yellow-400 text-black px-3 py-1 rounded-md font-medium hover:bg-yellow-500">
      🏠 Back to Home
    </a>
  </div>
</header>

<!-- Main Content -->
<main class="max-w-5xl mx-auto p-6">
  <!-- Heading -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-semibold text-gray-800">📋 All Students</h2>
    <a href="/students/new"
       class="bg-green-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-green-700 transition">
      ➕ Add Student
    </a>
  </div>

  <!-- Student Table -->
  <div class="bg-white shadow-lg rounded-lg overflow-hidden border">
    <table class="w-full border-collapse">
      <thead class="bg-indigo-600 text-white">
      <tr>
        <th class="py-3 px-4 text-left">ID</th>
        <th class="py-3 px-4 text-left">Name</th>
      </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
      <tr th:each="s : ${students}" class="hover:bg-gray-50 transition">
        <td class="py-3 px-4 text-gray-700" th:text="${s.id}"></td>
        <td class="py-3 px-4 text-gray-700 font-medium" th:text="${s.name}"></td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

</body>
</html>
